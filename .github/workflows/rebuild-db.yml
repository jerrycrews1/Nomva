name: Rebuild Food Database

permissions:
  contents: write

on:
  schedule:
    # Runs quarterly: Jan 1, Apr 1, Jul 1, Oct 1 at 9am UTC
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:   # Also allows manual trigger from GitHub UI anytime

jobs:
  build-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests pandas

      - name: Download USDA SR Legacy dataset
        run: |
          curl --fail --location --retry 3 -o sr_legacy.zip \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip"
          unzip -q sr_legacy.zip -d sr_legacy/
          rm sr_legacy.zip

      - name: Download USDA Foundation and FNDDS datasets
        run: |
          mkdir -p _build_data/foundation _build_data/fndds
          curl --fail --location --retry 3 -o foundation.zip \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip"
          curl --fail --location --retry 3 -o fndds.zip \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_json_2024-10-31.zip"
          unzip -q foundation.zip -d _build_data/foundation/
          unzip -q fndds.zip -d _build_data/fndds/
          rm foundation.zip fndds.zip

      - name: Download USDA Branded Foods dataset
        run: |
          # Check https://fdc.nal.usda.gov/download-foods.html for the current filename
          curl --fail --location --retry 3 -o branded.zip \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_branded_food_json_2026-04-30.zip"
          unzip -q branded.zip -d branded/
          rm branded.zip

      - name: Build SQLite database
        run: |
          # Stream the large gzip through a FIFO so it does not exhaust runner disk.
          mkdir -p open_food_facts
          mkfifo open_food_facts/openfoodfacts-products.jsonl.gz
          curl --fail --location --show-error --silent \
            "https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz" \
            > open_food_facts/openfoodfacts-products.jsonl.gz &
          off_download_pid=$!
          trap 'kill "$off_download_pid" 2>/dev/null || true' EXIT
          OPEN_FOOD_FACTS_PATH=open_food_facts/openfoodfacts-products.jsonl.gz python scripts/build_db.py
          wait "$off_download_pid"
          trap - EXIT

      - name: Package and publish database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gzip -9 -c Nomva/Resources/foods.sqlite > /tmp/foods.sqlite.gz

          database_sha="$(sha256sum Nomva/Resources/foods.sqlite | awk '{print $1}')"
          archive_sha="$(sha256sum /tmp/foods.sqlite.gz | awk '{print $1}')"
          release_tag="food-db-${database_sha:0:8}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" /tmp/foods.sqlite.gz --clobber
            gh release edit "$release_tag" --notes-file ci_scripts/food-database-release-notes.md
          else
            gh release create "$release_tag" /tmp/foods.sqlite.gz \
              --target "$GITHUB_SHA" \
              --title "Nomva food database ${database_sha:0:8}" \
              --notes-file ci_scripts/food-database-release-notes.md
          fi

          mkdir -p ci_scripts
          printf '%s\n' \
            "NOMVA_FOOD_DB_RELEASE=$release_tag" \
            "NOMVA_FOOD_DB_ASSET=foods.sqlite.gz" \
            "NOMVA_FOOD_DB_ARCHIVE_SHA256=$archive_sha" \
            "NOMVA_FOOD_DB_SHA256=$database_sha" \
            > ci_scripts/food-database.env

      - name: Commit database release manifest
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ci_scripts/food-database.env
          git diff --cached --quiet || \
            git commit -m "Update food database release $(date +'%Y-%m-%d')"
          git push

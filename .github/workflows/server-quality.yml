name: Server quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Restore and verify the real food catalog
        run: |
          command -v sqlite3 || sudo apt-get install -y sqlite3
          sh ../ci_scripts/ci_post_clone.sh
      - run: npm test
